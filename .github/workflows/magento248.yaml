name: magento248

on:
  push:
    branches: [ 2.4-develop ]
  pull_request:
    branches: [ 2.4-develop ]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.21
        env:
          MYSQL_ROOT_PASSWORD: 1
          MYSQL_DATABASE: m248
        ports:
          - 3306:3306

      opensearch:
        image: opensearchproject/opensearch:2.9.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          bootstrap.memory_lock: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v2
      - name: Updating all repositories
        run: sudo apt update
      - name: Installation php8.4
        run: sudo add-apt-repository -y ppa:ondrej/php && sudo apt update && sudo apt -y install php8.4 && sudo update-alternatives --set php /usr/bin/php8.4
      - name: Installation php extensions for Magento 2.4.8
        run: sudo apt -y install php8.4-common && sudo apt -y install php8.4-bcmath && sudo apt -y install php8.4-ctype && sudo apt -y install php8.4-curl && sudo apt -y install php8.4-xml && sudo apt -y install php8.4-mbstring && sudo apt -y install php8.4-gd && sudo apt -y install php8.4-intl && sudo apt -y install php8.4-iconv && sudo apt -y install php8.4-mysql && sudo apt -y install php8.4-simplexml && sudo apt -y install php8.4-soap && sudo apt -y install php8.4-xsl && sudo apt -y install php8.4-zip && sudo apt -y install php8.4-sockets
      - name: Installation Composer
        run: sudo apt -y install php8.4-cli unzip && curl -sS https://getcomposer.org/composer-2.phar -o /tmp/composer.phar
      - name: Installation Magento Coding Standard
        run: php /tmp/composer.phar create-project magento/magento-coding-standard --stability=dev /tmp/magento-coding-standard
      - name: Run Magento Coding Standard
        run: /tmp/magento-coding-standard/vendor/bin/phpcs --ignore="*.xml" --standard=Magento2 ./
      - name: Installation Magento 2.4.8
        run: php /tmp/composer.phar config --global http-basic.repo.magento.com ${MAGENTO2_USERNAME} ${MAGENTO2_PASSWORD} && php /tmp/composer.phar config --global allow-plugins true && php /tmp/composer.phar create-project --repository-url=https://repo.magento.com/ magento/project-community-edition=2.4.8 /tmp/magento2 && php /tmp/magento2/bin/magento setup:install --base-url=http://localhost/m248 --db-host="127.0.0.1:3306" --db-name=m248 --db-user=root --db-password=1 --admin-firstname=admin --admin-lastname=admin --admin-email=admin@admin.com --admin-user=admin --admin-password=admin123 --language=en_US --currency=USD --timezone=America/Chicago --use-rewrites=1 --search-engine=opensearch --opensearch-host=127.0.0.1 --opensearch-port=9200 --opensearch-index-prefix=m248 --opensearch-timeout=15
        env:
          MAGENTO2_USERNAME: ${{ secrets.MAGENTO2_USERNAME }}
          MAGENTO2_PASSWORD: ${{ secrets.MAGENTO2_PASSWORD }}
      - name: Copy EPuzzle_CustomerPrice module
        run: mkdir -p /tmp/magento2/app/code/EPuzzle/CustomerPrice && cp -r ./ /tmp/magento2/app/code/EPuzzle/CustomerPrice
      - name: Configure Production Mode
        run: php /tmp/magento2/bin/magento setup:upgrade && php /tmp/magento2/bin/magento deploy:mode:set production
      - name: Run Unit Tests
        run: php /tmp/magento2/vendor/phpunit/phpunit/phpunit --no-configuration /tmp/magento2/app/code/EPuzzle/CustomerPrice
